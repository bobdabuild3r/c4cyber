<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Cert IV Cyber Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: full-width week timeline; sticky bar with Schedule / Due dates tabs and a week strip. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #142030;
  --muted: #5b6878;
  --line: #d9e0e9;
  --accent: #1d4fd1;
  --accent-soft: #e3ebfd;
  --accent-ink: #ffffff;
  --soon: #a85d00;
  --soon-soft: #fff1dc;
  --urgent: #c4231c;
  --urgent-soft: #fde7e5;
  --past: #8b96a4;
  --holiday: #9a3b52;
  --holiday-soft: #fbe9ee;
  --u-fund: #0d7f74;
  --u-pentest: #c2412b;
  --u-nsda: #2b5fcf;
  --u-automate: #7647c2;
  --u-project: #a86a0d;
  --u-wit: #3d7a2e;
  --u-general: #5b6878;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141c; --surface: #151d28; --surface-2: #1a2431; --ink: #e4eaf2; --muted: #93a1b3; --line: #2a3646;
    --accent: #7ea2ff; --accent-soft: #1d2a47; --accent-ink: #0e141c; --soon: #f0b25a; --soon-soft: #3a2a12; --urgent: #ff7a70; --urgent-soft: #3e1a18; --past: #6b7787;
    --holiday: #f08aa2; --holiday-soft: #3a1c25;
    --u-fund: #4cc7b9; --u-pentest: #ff8a72; --u-nsda: #7ea2ff; --u-automate: #b896f5; --u-project: #e8b057; --u-wit: #8ccf78; --u-general: #93a1b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141c; --surface: #151d28; --surface-2: #1a2431; --ink: #e4eaf2; --muted: #93a1b3; --line: #2a3646;
  --accent: #7ea2ff; --accent-soft: #1d2a47; --accent-ink: #0e141c; --soon: #f0b25a; --soon-soft: #3a2a12; --urgent: #ff7a70; --urgent-soft: #3e1a18; --past: #6b7787;
  --holiday: #f08aa2; --holiday-soft: #3a1c25;
  --u-fund: #4cc7b9; --u-pentest: #ff8a72; --u-nsda: #7ea2ff; --u-automate: #b896f5; --u-project: #e8b057; --u-wit: #8ccf78; --u-general: #93a1b3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 150px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 28px 64px; }

/* Header */
.masthead { display: grid; gap: 12px; padding-bottom: 18px; }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.ver { font: 400 11px/1 var(--f-mono); color: var(--muted); opacity: .8; font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 800; font-stretch: 78%;
  font-size: clamp(30px, 5.2vw, 52px); line-height: 1; letter-spacing: -.01em; text-wrap: balance;
}
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 14px; }
.meta strong { color: var(--ink); font-weight: 600; }
.progress { display: grid; gap: 8px; max-width: 560px; }
.progress-track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0; }
.progress-label { font: 500 13px/1.3 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-label b { color: var(--ink); font-weight: 600; }

/* Sticky bar: tabs + week strip */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: grid; gap: 10px; padding-block: 10px;
}
.bar > * { min-width: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tab {
  cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--muted);
  font: 700 15px/1 var(--f-display); font-stretch: 92%; padding: 10px 14px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--ink); background: var(--surface); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab .n { font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 4px; background: var(--soon-soft); color: var(--soon); }
.tab[aria-selected="true"] .n { background: var(--soon); color: var(--surface); }
.next-due {
  margin-left: auto; display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap;
  font-size: 13.5px; color: var(--ink); background: var(--soon-soft); border-radius: 8px; padding: 8px 12px;
  text-decoration: none; min-width: 0;
}
.next-due b { color: var(--soon); font: 600 12px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; }
.next-due:hover { outline: 1px solid var(--soon); }
.next-due.urgent { background: var(--urgent-soft); box-shadow: inset 0 0 0 1px var(--urgent); }
.next-due.urgent b { color: var(--urgent); }
.tab .n.urgent { background: var(--urgent); color: var(--surface); }
.alert {
  display: grid; gap: 8px; margin: 0 0 14px; padding: 14px 16px 14px 20px; border-radius: 10px; position: relative;
  background: var(--urgent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--urgent);
}
.alert::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 10px 0 0 10px; background: var(--urgent); }
.alert-h { font: 800 17px/1.2 var(--f-display); font-stretch: 90%; color: var(--urgent); }
.alert ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.alert li { font-size: 14.5px; }
.alert li b { font-family: var(--f-mono); font-size: 13px; color: var(--urgent); margin-right: 6px; }
.alert .sub { font-size: 13.5px; color: var(--muted); }
.submit-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; font-size: 14.5px; }
.submit-box a { font-weight: 600; }
@media (max-width: 760px) { .next-due { margin-left: 0; width: 100%; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .next-due b { margin-right: 6px; } }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.wk {
  flex: 0 0 auto; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 9px; display: grid; gap: 2px; text-align: center; min-width: 52px;
  font-family: var(--f-mono); font-variant-numeric: tabular-nums;
}
.wk .a { font-size: 13px; font-weight: 600; }
.wk .b { font-size: 10.5px; color: var(--muted); }
.wk.past { opacity: .55; }
.wk.has-due { box-shadow: inset 0 -3px 0 var(--soon); }
.wk.has-urgent { box-shadow: inset 0 -4px 0 var(--urgent); }
.wk.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); opacity: 1; }
.wk.cur .b { color: var(--accent-ink); opacity: .85; }
.wk-gap { flex: 0 0 auto; align-self: center; font: 500 10.5px/1.2 var(--f-mono); color: var(--muted); padding: 0 4px; text-align: center; max-width: 64px; }

/* Filter */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 14px; }
.toolbar .label { font: 600 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 13px/1 var(--f-body); padding: 8px 11px; border-radius: 99px;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--c, var(--accent)); font-weight: 600; }
.reminder { font-size: 13.5px; color: var(--muted); margin-left: auto; }
.reminder b { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) { .reminder { margin-left: 0; } }

/* Weeks */
.weeks { display: grid; gap: 14px; }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.week.is-past { opacity: .8; }
.week.current { border: 2px solid var(--accent); box-shadow: 0 6px 24px -12px var(--accent); opacity: 1; }
.week > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 14px 18px; }
.week > summary::-webkit-details-marker { display: none; }
.week.current > summary { background: var(--accent); color: var(--accent-ink); }
.week.current .week-range { color: var(--accent-ink); opacity: .85; }
.week-no { font: 800 26px/1 var(--f-display); font-stretch: 80%; letter-spacing: -.01em; }
.week-range { font: 500 13px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.week-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.flag { font: 600 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; }
.flag.now { background: var(--accent-ink); color: var(--accent); }
.flag.due { background: var(--soon-soft); color: var(--soon); }
.flag.due.urgent { background: var(--urgent); color: var(--surface); }
.flag.hol { background: var(--holiday-soft); color: var(--holiday); }
.chev { width: 10px; height: 10px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .6; transform: rotate(45deg); margin-left: 4px; transition: transform .15s; align-self: center; }
.week[open] .chev { transform: rotate(-135deg); }
.week-body { border-top: 1px solid var(--line); }

.session { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 18px; padding: 18px 20px; border-top: 1px solid var(--line); }
.session:first-child { border-top: 0; }
.session.hl { background: var(--accent-soft); }
.session.hl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); }
.day { font-family: var(--f-mono); font-variant-numeric: tabular-nums; line-height: 1.15; }
.day .dow { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day .dnum { display: block; font-size: 26px; font-weight: 600; }
.day .dmon { display: block; font-size: 12px; color: var(--muted); }
.session.hl .day .dnum, .session.hl .day .dow { color: var(--accent); }
.s-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.unit-tag { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
.unit-tag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.part-tag { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--c, var(--ink)); background: var(--surface-2); border: 1px solid var(--line); padding: 4px 7px; border-radius: 4px; }
.pill { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); padding: 5px 7px; border-radius: 4px; }
.folder-link {
  display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--f-body); color: var(--accent);
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; text-decoration: none; white-space: nowrap;
}
.folder-link:hover { border-color: var(--accent); background: var(--accent-soft); }
.s-head .folder-link { margin-left: auto; }
.due-row .folder-link { margin-top: 8px; }
.toolbar .folder-link { font-size: 13px; padding: 8px 11px; }
.s-title { margin: 0 0 8px; font: 700 17px/1.3 var(--f-display); font-stretch: 92%; text-wrap: balance; }
.s-head { margin-bottom: 12px; }
@media (max-width: 760px) { .col-empty { display: none; } }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.cols > div { min-width: 0; }
.col-h { font: 600 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.txt { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.txt p { margin: 0 0 8px; }
.txt p:last-child { margin-bottom: 0; }
.txt hr { border: 0; border-top: 1px dashed var(--line); margin: 8px 0; }
.lab-link { text-decoration: none; }
.lab-link code { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.lab-link:hover code { text-decoration: underline; }
.txt code { font: 500 12.5px/1.4 var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
@media (max-width: 760px) {
  .cols { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .session { grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 14px; }
  .day .dnum { font-size: 20px; }
  .week > summary { padding: 12px 14px; }
}

.row-note { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 18px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: center; }
.row-note:first-child { border-top: 0; }
.row-note .day .dnum { font-size: 18px; }
.row-note.hol { background: var(--holiday-soft); }
.row-note.hol .what { color: var(--holiday); font-weight: 600; }
.row-note.duerow { background: var(--soon-soft); }
.row-note.duerow .what b { color: var(--soon); }
.row-note.duerow.urgent { background: var(--urgent-soft); box-shadow: inset 5px 0 0 var(--urgent); }
.row-note.duerow.urgent .what b { color: var(--urgent); }
.row-note.duerow .when { font: 600 12px/1 var(--f-mono); color: var(--urgent); margin-left: 6px; white-space: nowrap; }
.row-note.duerow.past { background: var(--surface-2); opacity: .7; }
.row-note.duerow.past .what b { color: var(--past); }
.row-note.empty .what { color: var(--muted); font-style: italic; }
@media (max-width: 760px) { .row-note { grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 12px 14px; } }

.break { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 14px 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
.break b { font: 800 18px/1 var(--f-display); font-stretch: 85%; color: var(--ink); }
.break span { font: 500 13px/1 var(--f-mono); }
.endmark { text-align: center; padding: 18px; font: 800 20px/1.2 var(--f-display); font-stretch: 85%; color: var(--muted); }

/* Due dates tab */
.due-wrap { display: grid; gap: 22px; margin-top: 18px; }
.due-wrap h2 { margin: 0 0 10px; font: 800 22px/1.1 var(--f-display); font-stretch: 85%; }
.due-table { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.due-row {
  display: grid; grid-template-columns: 76px minmax(0, 1fr) 130px 120px; gap: 16px; align-items: center;
  padding: 14px 18px; border-top: 1px solid var(--line); color: inherit; text-decoration: none;
}
.due-row:first-child { border-top: 0; }
.due-row { cursor: pointer; }
.due-row:hover { background: var(--surface-2); }
.due-row.next { background: var(--soon-soft); }
.due-date { font-family: var(--f-mono); font-variant-numeric: tabular-nums; line-height: 1.1; }
.due-date .d { display: block; font-size: 24px; font-weight: 600; }
.due-date .m { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.due-title { font-weight: 600; font-size: 15px; line-height: 1.35; }
.due-note { font-size: 13px; color: var(--muted); margin-top: 3px; }
.due-unit { font-size: 13px; color: var(--muted); }
.unit-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.count { justify-self: end; font: 600 12.5px/1 var(--f-mono); padding: 6px 9px; border-radius: 6px; background: var(--surface-2); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.due-row.soon { background: var(--urgent-soft); box-shadow: inset 5px 0 0 var(--urgent); }
.due-row.soon .count, .due-row.today .count { background: var(--urgent); color: var(--surface); }
.due-row.today { background: var(--urgent-soft); box-shadow: inset 5px 0 0 var(--urgent); }
.due-row.past { opacity: .6; }
.due-row.past .due-title { text-decoration: line-through; text-decoration-color: var(--past); }
@media (max-width: 760px) {
  .due-row { grid-template-columns: 56px minmax(0, 1fr); gap: 6px 12px; padding: 12px 14px; }
  .due-row .due-unit { grid-column: 2; }
  .due-row .count { grid-column: 2; justify-self: start; }
  .due-row .due-date { grid-row: span 3; }
}

.is-hidden { display: none !important; }
.to-top {
  position: fixed; z-index: 6; cursor: pointer;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 99px; padding: 11px 16px; background: var(--ink); color: var(--bg);
  font: 600 14px/1 var(--f-body); box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .45);
}
.to-top:hover { background: var(--accent); color: var(--accent-ink); }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
.notice.err { border-color: var(--holiday); }
.notice code { font-family: var(--f-mono); font-size: 13px; }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="wrap">
  <header class="masthead">
    <div class="topline"><div class="eyebrow" id="intake">Loading schedule…</div><div class="ver" id="ver"></div></div>
    <h1 id="title">Cert IV in Cyber Security</h1>
    <div class="meta" id="meta"></div>
    <div class="progress" id="progress" hidden>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label"></div>
    </div>
  </header>

  <div class="alert" id="alert" role="status" hidden></div>
  <div class="bar" id="bar" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" id="tab-schedule" data-view="schedule" aria-controls="view-schedule">Schedule</button>
      <button class="tab" type="button" role="tab" id="tab-due" data-view="due" aria-controls="view-due">Due dates <span class="n" id="due-n"></span></button>
      <a class="next-due" id="next-due" href="#due" hidden></a>
    </div>
    <div class="strip" id="strip" aria-label="Jump to week"></div>
  </div>

  <section id="view-schedule" role="tabpanel" aria-labelledby="tab-schedule">
    <div class="toolbar" id="toolbar" hidden>
      <span class="label">Show</span>
      <div id="chips" style="display:contents"></div>
      <a class="folder-link" id="unit-folder" target="_blank" rel="noopener" hidden></a>
      <a class="folder-link" id="unit-assess" target="_blank" rel="noopener" hidden></a>
      <span class="reminder" id="reminder" hidden></span>
    </div>
    <div class="weeks" id="weeks"><div class="notice">Loading the schedule…</div></div>
  </section>

  <section id="view-due" role="tabpanel" aria-labelledby="tab-due" hidden>
    <div class="due-wrap" id="due-wrap"></div>
  </section>

  <p class="foot" id="foot"></p>
  <button class="to-top" id="to-top" type="button" aria-label="Back to top" hidden><span aria-hidden="true">↑</span> Top</button>
</div>

<script>
(function () {
  "use strict";
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function parseDate(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
  function diffDays(a, b) { return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 86400000); }
  function fmt(d) { return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dayCell(d) { return '<div class="day"><span class="dow">' + DOW[d.getDay()] + '</span><span class="dnum">' + d.getDate() + '</span><span class="dmon">' + MON[d.getMonth()] + "</span></div>"; }
  function countdown(left) { return left < 0 ? "Closed" : left === 0 ? "Due today" : left === 1 ? "Tomorrow" : "In " + left + " days"; }

  // "Today" (add ?today=2027-03-03 to the URL to preview another date)
  var today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  try { var q = new URLSearchParams(location.search).get("today"); if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) today = parseDate(q); } catch (e) {}

  var linkNames = {}; // URL -> readable name, from "linkNames" in schedule.json
  function linkify(line) {
    var out = "", last = 0, re = /https?:\/\/[^\s)]+/g, m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index));
      var url = m[0], label = linkNames[url] || linkNames[url.replace(/\/$/, "")];
      if (!label) { label = url.replace(/^https?:\/\/(www\.)?/, ""); if (label.length > 48) label = label.slice(0, 45) + "…"; }
      out += '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + "</a>";
      last = m.index + url.length;
    }
    return out + esc(line.slice(last));
  }
  function renderText(t, unit) {
    if (!t || !String(t).trim()) return "";
    // Lab lines (C1T3L1 ...) always come first in a column, before links and other notes
    var isLab = function (l) { return /^C\dT\d+L\d+/.test(l.trim()); };
    var all = String(t).split("\n"), labs = all.filter(isLab), others = all.filter(function (l) { return !isLab(l); });
    if (labs.length) t = labs.join("\n") + "\n\n" + others.join("\n");
    t = t.replace(/\n\s*\n(\s*\n)+/g, "\n\n").trim();
    var html = "";
    String(t).split(/\n\s*\n/).forEach(function (b) {
      var lines = b.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
      if (!lines.length) return;
      var parts = lines.map(function (l) {
        if (/^-{3,}$/.test(l)) return "<hr>";
        var m = l.match(/^(C\dT\d+L\d+\w*)(.*)$/);
        if (!m) return thmLink(l) || linkify(l);
        var lf = (unit && labFolders.filter(function (x) { return x.unit === unit; })[0]) || labFolders.filter(function (x) { return m[1].indexOf(x.prefix + "T") === 0; })[0];
        var code = "<code>" + esc(m[1]) + "</code>";
        if (lf) code = '<a class="lab-link" href="' + esc(lf.url) + '" target="_blank" rel="noopener" title="Open lab folder">' + code + "</a>";
        return code + linkify(m[2]);
      });
      html += "<p>" + parts.join("<br>").replace(/<br><hr><br>/g, "<hr>").replace(/^<hr><br>|<br><hr>$/g, "<hr>") + "</p>";
    });
    return html.replace(/<p><hr><\/p>/g, "<hr>");
  }
  // Every "Topic N ..." line delivered that day becomes part of the bold heading; the rest stays in the Topics column
  function splitTopics(t) {
    var heads = [], rest = [], part = "";
    String(t || "").split("\n").forEach(function (l) {
      var x = l.trim();
      if (!part && /^Part\s*\d+$/i.test(x)) { part = x.replace(/\s+/g, " "); return; }
      if (/^Topic\s*\d+/i.test(x) && heads.indexOf(x.replace(/\s+/g, " ")) < 0) heads.push(x.replace(/\s+/g, " "));
      else rest.push(l);
    });
    if (!heads.length) { var f = firstLine(t); if (f) { heads.push(f); var i = rest.map(function (x) { return x.trim(); }).indexOf(f); if (i >= 0) rest.splice(i, 1); } }
    return { heads: heads, part: part, rest: rest.join("\n").replace(/^(\s*(-{3,})?\s*\n)+/, "").trim() };
  }
  function firstLine(t) {
    var l = String(t || "").split("\n").map(function (x) { return x.trim(); }).filter(function (x) { return x && !/^-{3,}$/.test(x); });
    return l[0] || "";
  }

  var labFolders = []; // [{unit, prefix, url}] from units with "labsFolder"
  var thmRooms = {};   // normalised room name -> URL, from "tryhackme" in schedule.json
  var normRoom = function (n) { return String(n).toLowerCase().replace(/\s+/g, " ").trim(); };
  // "Room name (TryHackMe)" or "TryHackMe: Room name (notes)" -> the room name becomes a link
  function thmLink(l) {
    var m = l.match(/^(.+?)\s*\(TryHackMe\)\s*$/), pre = "", name, rest = "";
    if (m) { name = m[1]; rest = " (TryHackMe)"; }
    else if ((m = l.match(/^(TryHackMe:\s*)(.+?)(\s*\([^)]*\))?\s*$/))) { pre = m[1]; name = m[2]; rest = m[3] || ""; }
    else return "";
    var url = thmRooms[normRoom(name)];
    if (!url) return "";
    return esc(pre) + '<a class="thm-link" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name.replace(/\s+/g, " ")) + "</a>" + esc(rest);
  }
  var filter = "all";
  try { filter = localStorage.getItem("cert4-filter") || "all"; } catch (e) {}

  function render(data) {
    var c = data.course || {};
    var units = {}; (data.units || []).forEach(function (u) { units[u.id] = u; });
    var unitColor = function (id) { return "var(--u-" + (units[id] ? id : "general") + ")"; };
    var unitName = function (id) { return units[id] ? units[id].name : "General"; };
    // Link to the unit's OneDrive folder (set "folder" on a unit in schedule.json); nothing shows until it is set
    // OneDrive links per unit: "labsFolder" and "assessmentFolder" in schedule.json (buttons stay hidden until set)
    var folderUrl = function (id, key) { var u = units[id], v = u && u[key || "labsFolder"]; return /^https:\/\//.test(v || "") ? v : ""; };
    linkNames = data.linkNames || {};
    thmRooms = {}; Object.keys(data.tryhackme || {}).forEach(function (k) { if (/^https:\/\//.test(data.tryhackme[k])) thmRooms[normRoom(k)] = data.tryhackme[k]; });
    labFolders = (data.units || []).filter(function (u) { return folderUrl(u.id); }).map(function (u) { return { unit: u.id, prefix: u.labPrefix || "", url: folderUrl(u.id) }; });
    var folderLink = function (id, label, key) { var f = folderUrl(id, key); return f ? '<a class="folder-link" href="' + esc(f) + '" target="_blank" rel="noopener">' + label + ' <span aria-hidden="true">↗</span></a>' : ""; };
    var start = parseDate(c.start), end = parseDate(c.end);
    var classDays = (c.classDays || ["Mon", "Tue", "Thu"]).map(function (d) { return DOW.indexOf(d); });

    document.getElementById("intake").textContent = c.intake || "";
    if (data.version) { var vu = data.updated ? parseDate(data.updated) : null; document.getElementById("ver").textContent = "v" + data.version + (vu ? " · updated " + vu.getDate() + " " + MON[vu.getMonth()] + " " + vu.getFullYear() : ""); }
    document.getElementById("title").textContent = c.title || "";
    var meta = ["<span><strong>" + fmt(start) + " " + start.getFullYear() + "</strong> to <strong>" + fmt(end) + " " + end.getFullYear() + "</strong></span>",
      "<span>Classes " + esc((c.classDays || []).join(", ")) + "</span>"];
    if (c.location) meta.unshift("<span>Location - <strong>" + esc(c.location) + "</strong></span>");
    if (c.platform && c.platform.url) meta.push('<a href="' + esc(c.platform.url) + '" target="_blank" rel="noopener">' + esc(c.platform.name || "Learning platform") + "</a>");
    document.getElementById("meta").innerHTML = meta.join("");

    var holidays = {}; (data.holidays || []).forEach(function (h) { holidays[h.date] = h.name; });
    var breaks = (data.breaks || []).map(function (b) { return { name: b.name, s: parseDate(b.start), e: parseDate(b.end) }; });
    var byDate = function (k) { return function (a, b) { return a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0; }; };
    var sessions = (data.sessions || []).slice().sort(byDate("date"));
    var assessments = (data.assessments || []).slice().sort(byDate("due"));

    // Teaching weeks (a week whose Mon-Fri sits inside a break is skipped)
    var weeks = [], cur = mondayOf(start), n = 0, lastBreak = null;
    while (cur <= end) {
      var fri = addDays(cur, 4);
      var br = breaks.filter(function (b) { return cur >= b.s && fri <= b.e; })[0];
      if (br) { if (lastBreak !== br) weeks.push({ isBreak: true, br: br }); lastBreak = br; }
      else { n++; weeks.push({ n: n, mon: new Date(cur), sun: addDays(cur, 6) }); }
      cur = addDays(cur, 7);
    }
    var totalWeeks = n, teach = weeks.filter(function (w) { return !w.isBreak; });
    var weekOf = function (ds) { var d = parseDate(ds); var w = teach.filter(function (w) { return d >= w.mon && d <= w.sun; })[0]; return w ? w.n : null; };

    // Where the schedule is now: current week, and the class to highlight (today's, else the next one)
    var current = null, inBreak = breaks.filter(function (b) { return today >= b.s && today <= b.e; })[0];
    teach.forEach(function (w) { if (today >= w.mon && today <= w.sun) current = w.n; });
    if (!current && today <= end) { var nx = teach.filter(function (w) { return w.mon > today; })[0]; if (nx) current = nx.n; }
    var hlSession = sessions.filter(function (s) { return s.date >= iso(today); })[0];
    var hlIsToday = hlSession && hlSession.date === iso(today);
    if (today > end) { current = null; hlSession = null; }

    // Progress line
    var pl = document.getElementById("progress-label"), pf = document.getElementById("progress-fill");
    if (today < start) { pl.innerHTML = "Starts <b>" + fmt(start) + "</b> · in " + diffDays(start, today) + " days"; }
    else if (today > end) { pl.innerHTML = "<b>Course complete</b>"; pf.style.width = "100%"; }
    else {
      pl.innerHTML = inBreak ? "<b>" + esc(inBreak.name) + "</b> · back " + fmt(addDays(inBreak.e, 1)) : "Week <b>" + current + "</b> of " + totalWeeks + " · " + diffDays(end, today) + " days to go";
      pf.style.width = Math.min(100, Math.round(((current - (inBreak ? 1 : 0.5)) / totalWeeks) * 100)) + "%";
    }
    document.getElementById("progress").hidden = false;

    // Due dates: counts, next-due strip, full tab
    var upcoming = assessments.filter(function (a) { return diffDays(parseDate(a.due), today) >= 0; });
    var nextA = upcoming[0];
    var isUrgent = function (a) { var l = diffDays(parseDate(a.due), today); return l >= 0 && l <= 7; };
    var urgent = upcoming.filter(isUrgent);
    var submit = c.submit && /^https:\/\//.test(c.submit.url || "") ? c.submit : null;
    var submitLink = submit ? '<a href="' + esc(submit.url) + '" target="_blank" rel="noopener">' + esc(submit.name || submit.url) + ' <span aria-hidden="true">↗</span></a>' : "";
    var dn = document.getElementById("due-n");
    dn.textContent = urgent.length ? urgent.length + " due soon" : upcoming.length ? upcoming.length + " open" : "";
    dn.classList.toggle("urgent", urgent.length > 0);
    var al = document.getElementById("alert");
    if (urgent.length) {
      al.innerHTML = '<div class="alert-h">' + (urgent.length === 1 ? "Assessment due within 7 days" : urgent.length + " assessments due within 7 days") + "</div><ul>" +
        urgent.map(function (a) { var l = diffDays(parseDate(a.due), today); return "<li><b>" + countdown(l).toUpperCase() + "</b>" + esc(a.title) + " · " + fmt(parseDate(a.due)) + "</li>"; }).join("") + "</ul>" +
        (submit ? '<div class="sub">Submit on ' + submitLink + "</div>" : "");
      al.hidden = false;
    }
    var nd = document.getElementById("next-due");
    if (nextA) {
      var ld = diffDays(parseDate(nextA.due), today);
      nd.classList.toggle("urgent", ld <= 7);
      nd.innerHTML = "<b>" + (ld <= 7 ? "Due soon" : "Next due") + "</b><span>" + esc(nextA.title) + "</span><span>· " + fmt(parseDate(nextA.due)) + " · " + countdown(ld) + "</span>";
      nd.hidden = false;
    }
    function dueRow(a) {
      var d = parseDate(a.due), left = diffDays(d, today), wk = weekOf(a.due);
      var cls = left < 0 ? "past" : left === 0 ? "today" : left <= 7 ? "soon" : "";
      if (a === nextA) cls += " next";
      return '<div class="due-row ' + cls + '" role="link" tabindex="0" data-week="' + (wk || "") + '" data-unit="' + esc(a.unit) + '">' +
        '<div class="due-date"><span class="m">' + DOW[d.getDay()] + '</span><span class="d">' + d.getDate() + '</span><span class="m">' + MON[d.getMonth()] + "</span></div>" +
        '<div><div class="due-title">' + esc(a.title) + "</div>" + (a.note ? '<div class="due-note">' + esc(a.note) + "</div>" : "") + folderLink(a.unit, "Assessment documents", "assessmentFolder") + "</div>" +
        '<div class="due-unit"><span class="unit-dot" style="--c:' + unitColor(a.unit) + '"></span>' + esc(unitName(a.unit)) + (wk ? " · Week " + wk : "") + "</div>" +
        '<span class="count">' + countdown(left) + "</span></div>";
    }
    var closed = assessments.filter(function (a) { return diffDays(parseDate(a.due), today) < 0; });
    var dueHtml = submit ? '<div class="submit-box"><b>Where to submit assessments:</b> ' + submitLink + "</div>" : "";
    dueHtml += "<div><h2>Upcoming</h2>" + (upcoming.length ? '<div class="due-table">' + upcoming.map(dueRow).join("") + "</div>" : '<div class="notice">Nothing due. All assessments have closed.</div>') + "</div>";
    if (closed.length) dueHtml += "<div><h2>Closed</h2><div class=\"due-table\">" + closed.map(dueRow).join("") + "</div></div>";
    document.getElementById("due-wrap").innerHTML = dueHtml;

    // Week strip
    var strip = "";
    weeks.forEach(function (w) {
      if (w.isBreak) { strip += '<span class="wk-gap">' + esc(w.br.name) + "</span>"; return; }
      var hasDue = assessments.some(function (a) { return weekOf(a.due) === w.n; });
      var hasUrgent = urgent.some(function (a) { return weekOf(a.due) === w.n; });
      strip += '<button class="wk' + (w.n === current ? " cur" : "") + (w.sun < today ? " past" : "") + (hasDue ? " has-due" : "") + (hasUrgent ? " has-urgent" : "") + '" type="button" data-week="' + w.n + '" title="Week ' + w.n + (hasDue ? " · assessment due" : "") + '">' +
        '<span class="a">W' + w.n + '</span><span class="b">' + w.mon.getDate() + " " + MON[w.mon.getMonth()] + "</span></button>";
    });
    document.getElementById("strip").innerHTML = strip;

    // Filter chips
    var used = {}; sessions.concat(assessments).forEach(function (s) { used[s.unit] = 1; });
    var chips = document.getElementById("chips");
    chips.innerHTML = '<button class="chip" type="button" data-f="all">All units</button>' + (data.units || []).filter(function (u) { return used[u.id] && u.id !== "general"; }).map(function (u) {
      return '<button class="chip" type="button" data-f="' + esc(u.id) + '" style="--c:' + unitColor(u.id) + '" title="' + esc(u.codes || "") + '"><span class="dot"></span>' + esc(u.name) + "</button>";
    }).join("");
    if (c.reminder) { var r = document.getElementById("reminder"); r.innerHTML = "<b>Reminder:</b> " + esc(c.reminder); r.hidden = false; }
    document.getElementById("toolbar").hidden = false;

    // A topic taught over several days ("Part 1", "Part 2" lines): count the parts so the heading can say "Part 1 of 2"
    var partTotals = {};
    sessions.forEach(function (x) { var t = splitTopics(x.topics); if (t.part) { var k = x.unit + "|" + t.heads.join("|"); partTotals[k] = (partTotals[k] || 0) + 1; } });

    // Weeks
    var html = "";
    weeks.forEach(function (w) {
      if (w.isBreak) { html += '<div class="break"><b>' + esc(w.br.name) + "</b><span>" + fmt(w.br.s) + " – " + fmt(w.br.e) + "</span><span>No classes</span></div>"; return; }
      var rows = [];
      classDays.forEach(function (k) {
        var d = addDays(w.mon, (k + 6) % 7), key = iso(d);
        if (holidays[key] && d >= start && d <= end) rows.push({ date: key, kind: "hol", name: holidays[key] });
      });
      sessions.forEach(function (s) { var d = parseDate(s.date); if (d >= w.mon && d <= w.sun) rows.push({ date: s.date, kind: "s", s: s }); });
      var dues = assessments.filter(function (a) { var d = parseDate(a.due); return d >= w.mon && d <= w.sun; });
      dues.forEach(function (a) { rows.push({ date: a.due, kind: "due", a: a }); });
      rows.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === "due" ? 1 : -1); });

      var isPast = w.sun < today, isCur = w.n === current, flags = "";
      if (isCur) flags += '<span class="flag now">' + (today < w.mon ? (w.n === 1 ? "Starts here" : "Up next") : "This week") + "</span>";
      if (dues.length) flags += '<span class="flag due' + (dues.some(isUrgent) ? " urgent" : "") + '">' + dues.length + " due</span>";
      if (rows.some(function (r) { return r.kind === "hol"; })) flags += '<span class="flag hol">Public holiday</span>';

      var body = "";
      rows.forEach(function (r) {
        var d = parseDate(r.date);
        if (r.kind === "hol") {
          body += '<div class="row-note hol" data-unit="any">' + dayCell(d) + '<div class="what">Public holiday: ' + esc(r.name) + " · no class</div></div>";
        } else if (r.kind === "due") {
          body += '<div class="row-note duerow' + (d < today ? " past" : "") + (isUrgent(r.a) ? " urgent" : "") + '" data-unit="' + esc(r.a.unit) + '">' + dayCell(d) + '<div class="what"><b>Due</b> · ' + esc(r.a.title) + (r.a.note ? ' <span style="color:var(--muted)">(' + esc(r.a.note) + ")</span>" : "") + (folderUrl(r.a.unit, "assessmentFolder") ? " " + folderLink(r.a.unit, "Assessment documents", "assessmentFolder") : "") + (isUrgent(r.a) ? '<span class="when">' + countdown(diffDays(d, today)) + "</span>" : "") + (submit && d >= today ? ' · <a href="' + esc(submit.url) + '" target="_blank" rel="noopener">Submit ↗</a>' : "") + "</div></div>";
        } else {
          var s = r.s, hl = s === hlSession, cols = "";
          var tp = splitTopics(s.topics), partTag = "";
          if (tp.part) { var tot = partTotals[s.unit + "|" + tp.heads.join("|")] || 1; partTag = '<span class="part-tag">' + esc(tp.part) + (tot > 1 ? " of " + tot : "") + "</span>"; }
          // Fixed three columns: Topics (bold topics, sub-topics under) | In class | Extra / home task
          var heads = s.title ? [s.title].concat(tp.heads.filter(function (h) { return h !== s.title && /^Topic/i.test(h); })) : tp.heads;
          var topicsHtml = (heads.length ? '<h3 class="s-title">' + heads.map(esc).join("<br>") + "</h3>" : "") + (tp.rest ? '<div class="txt">' + renderText(tp.rest, s.unit) + "</div>" : "");
          cols = '<div><div class="col-h">Topics</div>' + topicsHtml + "</div>";
          [["In class", s.activities], ["Extra / home task", s.homework]].forEach(function (p) {
            var has = p[1] && String(p[1]).trim();
            cols += '<div' + (has ? "" : ' class="col-empty"') + '><div class="col-h">' + p[0] + '</div>' + (has ? '<div class="txt">' + renderText(p[1], s.unit) + "</div>" : '<div class="txt" style="color:var(--muted)">—</div>') + "</div>";
          });
          body += '<article class="session' + (hl ? " hl" : "") + '"' + (hl ? ' id="now"' : "") + ' data-unit="' + esc(s.unit) + '">' + dayCell(d) + "<div>" +
            '<div class="s-head"><span class="unit-tag" style="--c:' + unitColor(s.unit) + '">' + esc(unitName(s.unit)) + "</span>" +
            (hl ? '<span class="pill">' + (hlIsToday ? "Today" : "Next class") + "</span>" : "") + partTag + folderLink(s.unit, "Lab files") + "</div>" +
            '<div class="cols">' + cols + "</div></div></article>";
        }
      });
      if (!rows.some(function (r) { return r.kind === "s"; })) body += '<div class="row-note empty" data-unit="any"><div></div><div class="what">No classes scheduled this week.</div></div>';
      var fr = addDays(w.mon, 4);
      html += '<details class="week' + (isCur ? " current" : "") + (isPast ? " is-past" : "") + '" id="week-' + w.n + '"' + (isPast ? "" : " open") + ">" +
        '<summary><span class="week-no">Week ' + w.n + '</span><span class="week-range">' + w.mon.getDate() + " " + MON[w.mon.getMonth()] + " – " + fr.getDate() + " " + MON[fr.getMonth()] + '</span><span class="week-flags">' + flags + '<span class="chev" aria-hidden="true"></span></span></summary>' +
        '<div class="week-body">' + body + "</div></details>";
    });
    html += '<div class="endmark">Course ends ' + fmt(end) + " " + end.getFullYear() + "</div>";
    document.getElementById("weeks").innerHTML = html;
    document.getElementById("bar").hidden = false;
    if (data.updated) { var up = parseDate(data.updated); document.getElementById("foot").textContent = "Schedule last updated " + fmt(up) + " " + up.getFullYear() + ". Dates can change; check with your teacher if unsure."; }

    // Filter
    function applyFilter() {
      chips.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-f") === filter ? "true" : "false"); });
      [["unit-folder", "labsFolder", "Lab files"], ["unit-assess", "assessmentFolder", "Assessment documents"]].forEach(function (x) {
        var el = document.getElementById(x[0]), fu = filter !== "all" ? folderUrl(filter, x[1]) : "";
        el.hidden = !fu;
        if (fu) { el.href = fu; el.innerHTML = esc(unitName(filter)) + ": " + x[2] + ' <span aria-hidden="true">↗</span>'; }
      });
      document.querySelectorAll("#weeks [data-unit]").forEach(function (el) {
        var u = el.getAttribute("data-unit");
        el.classList.toggle("is-hidden", filter !== "all" && u !== filter && u !== "any");
      });
      document.querySelectorAll(".week").forEach(function (wk) {
        wk.classList.toggle("is-hidden", filter !== "all" && !wk.querySelector(".session:not(.is-hidden), .duerow:not(.is-hidden)"));
      });
    }
    if (filter !== "all" && !chips.querySelector('[data-f="' + filter + '"]')) filter = "all";
    chips.addEventListener("click", function (e) {
      var b = e.target.closest(".chip"); if (!b) return;
      filter = filter === b.getAttribute("data-f") ? "all" : b.getAttribute("data-f");
      try { localStorage.setItem("cert4-filter", filter); } catch (er) {}
      applyFilter();
    });
    applyFilter();

    // Tabs (#schedule / #due)
    function show(view) {
      document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", t.getAttribute("data-view") === view ? "true" : "false"); });
      document.getElementById("view-schedule").hidden = view !== "schedule";
      document.getElementById("view-due").hidden = view !== "due";
      document.getElementById("strip").hidden = view !== "schedule";
    }
    function goWeek(nw, smooth) {
      if (location.hash === "#due") { history.replaceState(null, "", "#schedule"); }
      show("schedule");
      var el = document.getElementById("week-" + nw); if (!el) return;
      el.open = true; el.classList.remove("is-hidden");
      var now = document.getElementById("now"), useNow = nw == current && now && !now.classList.contains("is-hidden");
      // Show the week header at the top; if the highlighted class would be below the fold, show the class instead
      var target = useNow && (now.getBoundingClientRect().top - el.getBoundingClientRect().top) > window.innerHeight * 0.55 ? now : el;
      target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    }
    document.querySelectorAll(".tab").forEach(function (t) {
      t.addEventListener("click", function () { var v = t.getAttribute("data-view"); history.replaceState(null, "", "#" + v); show(v); window.scrollTo({ top: 0 }); });
    });
    window.addEventListener("hashchange", function () { show(location.hash === "#due" ? "due" : "schedule"); });
    document.getElementById("strip").addEventListener("click", function (e) { var b = e.target.closest(".wk"); if (b) goWeek(b.getAttribute("data-week"), true); });
    function openDueRow(e) {
      if (e.target.closest("a")) return; // let the OneDrive link open
      var a = e.target.closest(".due-row"); if (!a || !a.getAttribute("data-week")) return;
      if (e.type === "keydown" && e.key !== "Enter") return;
      e.preventDefault(); history.replaceState(null, "", "#schedule"); goWeek(a.getAttribute("data-week"), false);
    }
    document.getElementById("due-wrap").addEventListener("click", openDueRow);
    document.getElementById("due-wrap").addEventListener("keydown", openDueRow);
    nd.addEventListener("click", function (e) { e.preventDefault(); history.replaceState(null, "", "#due"); show("due"); window.scrollTo({ top: 0 }); });

    show(location.hash === "#due" ? "due" : "schedule");
    // Keep the current week visible in the strip, and open the page at today's class during the course
    var curBtn = document.querySelector(".wk.cur");
    if (curBtn) { var s = document.getElementById("strip"); s.scrollLeft = curBtn.offsetLeft - s.clientWidth / 2 + curBtn.clientWidth / 2; }
    if (location.hash !== "#due" && current && today >= start) requestAnimationFrame(function () { goWeek(current, false); });
  }

  // Back to top button: shows once the page is scrolled down
  (function () {
    var tt = document.getElementById("to-top");
    var update = function () { tt.hidden = window.scrollY < 500; };
    window.addEventListener("scroll", update, { passive: true }); update();
    tt.addEventListener("click", function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
  })();

  function showError(msg) { document.getElementById("weeks").innerHTML = '<div class="notice err"><strong>The schedule could not be loaded.</strong><p>' + msg + "</p></div>"; }

  fetch("schedule.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("schedule.json returned HTTP " + r.status + "."); return r.text(); })
    .then(function (txt) {
      var data;
      try { data = JSON.parse(txt); }
      catch (e) {
        var pos = (String(e.message).match(/position (\d+)/) || [])[1];
        var where = pos ? " The problem is around line " + txt.slice(0, +pos).split("\n").length + "." : "";
        showError("schedule.json has a formatting mistake." + where + " Check for a missing comma, quote mark or bracket near that line. <code>" + esc(e.message) + "</code>");
        return;
      }
      render(data);
    })
    .catch(function (e) { showError(esc(e.message) + " If you opened index.html straight from your computer, the browser blocks it; view it on the GitHub Pages site instead."); });
})();
</script>
<!--BODY-END-->
